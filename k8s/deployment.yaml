apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-inference-api
  namespace: ai-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-inference-api

  template:
    metadata:
      labels:
        app: ai-inference-api

    spec:
      containers:
      - name: ai-inference-api
        image: ai-inference-api:v1
        imagePullPolicy: Never

        ports:
        - containerPort: 8000

        env:
        - name: OLLAMA_URL
          value: "http://172.17.0.1:11434/api/generate"
